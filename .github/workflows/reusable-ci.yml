name: Reusable CI Workflow

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.12"
            package-manager:
                description: "Package manager to use (pip or uv)"
                required: false
                type: string
                default: "pip"
            linter:
                description: "Linter to use (ruff or flake8)"
                required: false
                type: string
                default: "ruff"
            package-structure:
                description: "Package structure (src or app)"
                required: false
                type: string
                default: "src"
            run-precommit:
                description: "Whether to run pre-commit checks"
                required: false
                type: boolean
                default: true
            extra-install-args:
                description: 'Extra arguments for pip/uv install (e.g., ".[dev]" or "")'
                required: false
                type: string
                default: ".[dev]"

permissions:
    contents: read

jobs:
    pre-commit:
        name: Run Pre-commit Checks
        runs-on: ubuntu-latest
        if: ${{ inputs.run-precommit }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ inputs.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Run pre-commit on all files
              run: pre-commit run --all-files

    test-and-lint:
        name: Run Tests and Lint
        runs-on: ubuntu-latest
        needs: pre-commit
        if: ${{ !failure() }} # Run even if pre-commit is skipped
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ inputs.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ inputs.python-version }}

            # Package manager: pip
            - name: Install dependencies (pip)
              if: ${{ inputs.package-manager == 'pip' }}
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest pytest-cov
                  if [ "${{ inputs.linter }}" == "ruff" ]; then
                    pip install ruff
                  else
                    pip install flake8
                  fi
                  if [ -n "${{ inputs.extra-install-args }}" ]; then
                    pip install -e "${{ inputs.extra-install-args }}"
                  fi
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            # Package manager: uv
            - name: Install dependencies (uv)
              if: ${{ inputs.package-manager == 'uv' }}
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  if [ -n "${{ inputs.extra-install-args }}" ]; then
                    uv pip install --system -e "${{ inputs.extra-install-args }}"
                  fi
                  if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

            # Linter: ruff
            - name: Lint with ruff
              if: ${{ inputs.linter == 'ruff' }}
              run: |
                  ruff check .
                  ruff format --check .

            # Linter: flake8
            - name: Lint with flake8
              if: ${{ inputs.linter == 'flake8' }}
              run: |
                  flake8 ${{ inputs.package-structure }}/ --count --select=E9,F63,F7,F82 --show-source --statistics
                  flake8 ${{ inputs.package-structure }}/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            # Run tests
            - name: Test with pytest
              run: pytest
