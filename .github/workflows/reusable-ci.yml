name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      extra-install-args:
        description: 'Extra arguments for uv install (e.g., ".[dev]" or "")'
        required: false
        type: string
        default: ".[dev]"
      skip-precommit:
        description: "Skip pre-commit checks"
        required: false
        type: boolean
        default: false
      skip-lint:
        description: "Skip linting with ruff"
        required: false
        type: boolean
        default: false
      skip-tests:
        description: "Skip pytest tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run Pre-commit Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-precommit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    needs: pre-commit
    if: ${{ !failure() && !inputs.skip-lint }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Run Tests with Pytest
    runs-on: ubuntu-latest
    needs: pre-commit
    if: ${{ !failure() && !inputs.skip-tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with uv
        run: |
          if [ -n "${{ inputs.extra-install-args }}" ]; then
          uv pip install --system -e "${{ inputs.extra-install-args }}"
          fi
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Test with pytest
        run: pytest
