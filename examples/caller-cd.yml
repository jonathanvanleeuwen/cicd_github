# ============================================================================
# REQUIRED SETUP
# ============================================================================
#
# 1. Create a Personal Access Token (PAT):
#    - Go to: https://github.com/settings/tokens?type=beta
#    - Create a fine-grained token with these permissions:
#      * Repository access: Select your repositories
#      * Permissions:
#        - Contents: Read and write
#        - Workflows: Read and write (for accessing private cicd_github repo)
#        - Metadata: Read-only (automatic)
#
# 2. Add the token as a repository secret:
#    - Go to your repo → Settings → Secrets and variables → Actions
#    - Create new secret: RELEASE_TOKEN
#    - Paste your PAT
#
# 3. Configure pyproject.toml for semantic-release:
#    Add this to your pyproject.toml:
#
#    [tool.semantic_release]
#    version_toml = ["pyproject.toml:project.version"]
#    version_variables = ["src/YOUR_PACKAGE/__init__.py:__version__"]
#    branch = "main"
#    upload_to_vcs_release = true
#    upload_to_pypi = false
#    build_command = "pip install build && python -m build"
#
# 4. Add coverage markers to README.md:
#    Add these HTML comments where you want the coverage badge:
#
#    <!-- Pytest Coverage Comment:Begin -->
#    <!-- Pytest Coverage Comment:End -->
#
# 5. Commit message format for versioning:
#    - fix: ... → patch version (0.0.X)
#    - feat: ... → minor version (0.X.0)
#    - feat: ... \n\nBREAKING CHANGE: ... → major version (X.0.0)
#
# ============================================================================
# VERSIONING
# ============================================================================
# To pin to a specific version instead of @main:
# uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-cd.yml@v1.0.0
#
# To use a specific branch:
# uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-cd.yml@develop
