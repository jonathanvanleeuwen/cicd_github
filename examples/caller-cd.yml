# Example CD Caller Workflow

# This example shows how to call the reusable CD workflow from your repository.
# Copy this file to your repo at: .github/workflows/semantic-release.yml

name: Release Pipeline - Coverage, Versioning & Publishing

on:
  pull_request:
    branches:
      - main
    types: [closed]

# Permissions for GITHUB_TOKEN (used for releases, not pushing)
permissions:
  contents: write
  pull-requests: read

jobs:
  cd:
    uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-cd.yml@main
    with:
      python-version: "3.12" # Python version to use
      package-name: "YOUR_PACKAGE_NAME" # REQUIRED: Name of your package
      extra-install-args: ".[dev]" # Install args (e.g., '.[dev]' or '' for none)
      # Optional: coverage-path: 'custom/path'  # Override coverage path
      # Optional: skip-coverage: true           # Skip coverage report
      # Optional: skip-release: true            # Skip semantic versioning
      # Optional: skip-publish: true            # Skip wheel publishing
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }} # PAT with Contents: Read/write

# Note: Workflows always use uv package manager

# ============================================================================
# CONFIGURATION EXAMPLES
# ============================================================================

# Example 1: Standard Library with src/ structure
#   Package name: my_awesome_lib
#   Coverage path: src/my_awesome_lib (auto-detected)
# jobs:
#   cd:
#     uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-cd.yml@main
#     with:
#       python-version: '3.12'
#       package-name: 'my_awesome_lib'
#       extra-install-args: '.[dev]'
#     secrets:
#       RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

# Example 2: Custom Coverage Path
#   Package name: document_search
#   Coverage path: app/src/document_search (custom)
# jobs:
#   cd:
#     uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-cd.yml@main
