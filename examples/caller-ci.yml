# ============================================================================
# VERSIONING
# ============================================================================
# To pin to a specific version instead of @main:
# uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@v1.0.0
#
# To use a specific branch:
# uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@develop
