# ============================================================================
# VERSIONING
# ============================================================================
# To pin to a specific version instead of @main:
# uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-ci.yml@v1.0.0
#
# To use a specific branch:
# uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-ci.yml@develop
