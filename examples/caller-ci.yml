# Example CI Caller Workflow

# This example shows how to call the reusable CI workflow from your repository.
# Copy this file to your repo at: .github/workflows/python-app.yml

name: Python Application CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@main
    with:
      python-version: "3.12" # Python version to use
      package-manager: "pip" # 'pip' or 'uv'
      linter: "ruff" # 'ruff' or 'flake8'
      package-structure: "src" # 'src' or 'app'
      run-precommit: true # Whether to run pre-commit hooks
      extra-install-args: ".[dev]" # Install args (e.g., '.[dev]' or '' for none)

# ============================================================================
# CONFIGURATION EXAMPLES
# ============================================================================

# Example 1: Modern FastAPI/Library Template (Default)
#   Uses: ruff, pip, src/, pre-commit
# jobs:
#   ci:
#     uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       package-manager: 'pip'
#       linter: 'ruff'
#       package-structure: 'src'
#       run-precommit: true
#       extra-install-args: '.[dev]'

# Example 2: Legacy Project with UV and Flake8
#   Uses: flake8, uv, app/, pre-commit
# jobs:
#   ci:
#     uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       package-manager: 'uv'
#       linter: 'flake8'
#       package-structure: 'app'
#       run-precommit: true
#       extra-install-args: '.[dev]'

# Example 3: Simple Library (No Pre-commit)
#   Uses: ruff, pip, src/, no pre-commit
# jobs:
#   ci:
#     uses: YOUR_GITHUB_USERNAME/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       package-manager: 'pip'
#       linter: 'ruff'
#       package-structure: 'src'
#       run-precommit: false
