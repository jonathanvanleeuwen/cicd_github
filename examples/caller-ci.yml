# Example CI Caller Workflow

# This example shows how to call the reusable CI workflow from your repository.
# Copy this file to your repo at: .github/workflows/python-app.yml

name: Python Application CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@main
    with:
      python-version: "3.12" # Python version to use
      extra-install-args: ".[dev]" # Install args (e.g., '.[dev]' or '' for none)
      # Optional: skip-precommit: true  # Skip pre-commit checks
      # Optional: skip-lint: true        # Skip ruff linting
      # Optional: skip-tests: true       # Skip pytest tests
# Note: Workflows always use uv package manager and ruff linter

# ============================================================================
# CONFIGURATION EXAMPLES
# ============================================================================

# Example 1: Standard Configuration (All Steps Enabled)
#   Runs: pre-commit, ruff linting, pytest
# jobs:
#   ci:
#     uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       extra-install-args: '.[dev]'

# Example 2: Skip Pre-commit Checks
#   Runs: ruff linting, pytest (no pre-commit)
# jobs:
#   ci:
#     uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       extra-install-args: '.[dev]'
#       skip-precommit: true

# Example 3: Skip Linting
#   Runs: pre-commit, pytest (no ruff linting)
# jobs:
#   ci:
#     uses: jonathanvanleeuwen/cicd_github/.github/workflows/reusable-ci.yml@main
#     with:
#       python-version: '3.12'
#       extra-install-args: '.[dev]'
#       skip-lint: true

# Example 4: Minimal Setup (Only Tests)
