[project]
name = "cicd_github"
version = "1.0.0"
description = "Reusable GitHub Actions workflows for Python projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_vcs_release = true
upload_to_pypi = false
build_command = "echo 'No build needed for workflow repository'"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "fix",
    "feat",
    "docs",
    "chore",
    "refactor",
    "perf",
    "test",
    "ci",
    "build",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
